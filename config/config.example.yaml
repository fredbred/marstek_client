# Configuration Marstek Automation

# Batteries Marstek
# Port UDP: 30000 par défaut Marstek ; 49154 uniquement pour la batterie 2 si configurée ainsi.
batteries:
  - id: "battery_1"
    name: "Batterie Salon"
    ip: "192.168.1.100"
    port: 30000  # Port Marstek par défaut
  - id: "battery_2"
    name: "Batterie Garage"
    ip: "192.168.1.101"
    port: 49154  # Port modifié dans l'app Marstek pour cette batterie
  - id: "battery_3"
    name: "Batterie Cave"
    ip: "192.168.1.102"
    port: 30000  # Port Marstek par défaut

# Modes de fonctionnement
modes:
  auto:
    start_hour: 6
    end_hour: 22
  manual:
    start_hour: 22
    end_hour: 6

# API Tempo RTE
tempo:
  enabled: true
  api_url: "https://www.api-rte.com/application/json"
  contract_number: ""  # À remplir
  timeout: 10

# Telegram
telegram:
  enabled: true
  bot_token: ""  # À remplir
  chat_id: ""    # À remplir

# Database
database:
  host: "postgres"
  port: 5432
  user: "marstek"
  password: ""  # À remplir ou via env var
  database: "marstek_db"

# Redis
redis:
  host: "redis"
  port: 6379
  db: 0

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/marstek.log"

# Scheduler
scheduler:
  timezone: "Europe/Paris"
  max_workers: 4

